services:
  - type: web
    name: agenda-clinicorp
    runtime: docker
    plan: free
    region: ohio
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: NODE_ENV
        value: production
      - key: FUSO_HORARIO
        value: America/Sao_Paulo
      - key: PROXIES_CONFIAVEIS
        value: "1"
